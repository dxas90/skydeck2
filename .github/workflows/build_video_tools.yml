name: Build video tools

# Builds two binaries needed for the independent video pipeline (no Aviateur):
#
#   rxdemo   — OpenIPC/devourer  — userspace RTL8812AU driver (RF capture)
#   wfb_rx   — svpcom/wfb-ng    — WFB-NG decryptor (raw frames → RTP UDP)
#
# Both are x86_64 Linux static binaries, shipped as release assets so
# install.sh can download them to the Steam Deck without any build tools.
#
# Runs on every push/PR (artifact only) and on v* tags (release asset).

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]

jobs:
  # ---------------------------------------------------------------------------
  # 1. devourer rxdemo
  # ---------------------------------------------------------------------------
  build-devourer:
    name: Build devourer rxdemo (x86_64 Linux)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ pkg-config libusb-1.0-0-dev git

      - name: Clone devourer
        env:
          DEVOURER_REF: master
        run: |
          git clone --depth 1 --branch "$DEVOURER_REF" \
            https://github.com/OpenIPC/devourer.git /tmp/devourer-src
          echo "DEVOURER_SHA=$(git -C /tmp/devourer-src rev-parse --short HEAD)" \
            >> "$GITHUB_ENV"

      - name: Configure (RTL8812AU only)
        run: |
          cmake -S /tmp/devourer-src -B /tmp/devourer-build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXE_LINKER_FLAGS="-static-libgcc -static-libstdc++" \
            -DDEVOURER_8814=OFF \
            -DDEVOURER_JAGUAR2_8822B=OFF \
            -DDEVOURER_JAGUAR2_8821C=OFF \
            -DDEVOURER_JAGUAR3_8822C=OFF \
            -DDEVOURER_JAGUAR3_8822E=OFF \
            -DDEVOURER_8733B=OFF \
            -DDEVOURER_KESTREL_8852B=OFF \
            -DDEVOURER_KESTREL_8852C=OFF \
            -DDEVOURER_LOG_MAX_LEVEL=WARN

      - name: Build
        run: cmake --build /tmp/devourer-build --parallel

      - name: Self-tests
        run: ctest --test-dir /tmp/devourer-build --output-on-failure

      - name: Package
        run: |
          RXDEMO=$(find /tmp/devourer-build -name "rxdemo" -type f | head -1)
          echo "Binary: $RXDEMO"
          file "$RXDEMO"
          ldd  "$RXDEMO" || true

          mkdir -p /tmp/dist-devourer
          cp "$RXDEMO" /tmp/dist-devourer/rxdemo
          printf 'devourer_sha=%s\nbuilt=%s\nskydeck_tag=%s\n' \
            "$DEVOURER_SHA" \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            "$GITHUB_REF_NAME" \
            > /tmp/dist-devourer/devourer.version
          chmod +x /tmp/dist-devourer/rxdemo

          tar -czf /tmp/rxdemo-x86_64-linux.tar.gz -C /tmp/dist-devourer .
          sha256sum /tmp/rxdemo-x86_64-linux.tar.gz \
            > /tmp/rxdemo-x86_64-linux.tar.gz.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: rxdemo-x86_64-linux
          path: |
            /tmp/rxdemo-x86_64-linux.tar.gz
            /tmp/rxdemo-x86_64-linux.tar.gz.sha256
          retention-days: 14

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            /tmp/rxdemo-x86_64-linux.tar.gz
            /tmp/rxdemo-x86_64-linux.tar.gz.sha256

  # ---------------------------------------------------------------------------
  # 2. skydeck_rx — headless WFB-NG video receiver
  #
  # Aviateur already contains the full pipeline:
  #   devourer (libusb RF capture) + wfb-ng aggregator (decrypt/FEC) + ffmpeg
  # We clone Aviateur, build only its wifi+player stack (no GUI, no SDL),
  # and add a tiny headless main that writes decoded RTP to UDP.
  #
  # This produces one self-contained binary that replaces both rxdemo + wfb_rx:
  #   skydeck_rx → udp://127.0.0.1:5600 → gst-launch / mpv
  # ---------------------------------------------------------------------------
  build-skydeck-rx:
    name: Build skydeck_rx headless (x86_64 Linux)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ pkg-config git \
            libusb-1.0-0-dev libsodium-dev libpcap-dev \
            libavcodec-dev libavformat-dev libavutil-dev \
            libswscale-dev libswresample-dev

      - name: Clone Aviateur (wifi + devourer submodules only — skip GUI)
        env:
          AVIATEUR_REF: main
        run: |
          # Clone without submodules first, then init only what we need.
          # vecgui (3rd/vecgui) and SDL (3rd/SDL) are GUI-only — skip them.
          # The headless build needs: 3rd/devourer, 3rd/json, 3rd/mINI
          git clone --depth 1 --branch "$AVIATEUR_REF" \
            https://github.com/OpenIPC/aviateur.git /tmp/aviateur-src
          cd /tmp/aviateur-src
          git submodule update --init --depth 1 \
            3rd/devourer \
            3rd/json \
            3rd/mINI
          echo "AVIATEUR_SHA=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Write headless main (no GUI, no SDL — just devourer + wfb + UDP out)
        run: |
          cat > /tmp/aviateur-src/src/headless_main.cpp << 'EOF'
          /*
           * headless_main.cpp — SkyDeck headless WFB-NG receiver
           * Compiled in place of Aviateur's main.cpp when building skydeck_rx.
           * Uses the same WfbngLink + ffmpeg player stack, outputs video to UDP.
           */
          #include <csignal>
          #include <cstdio>
          #include <cstdlib>
          #include <atomic>
          #include <string>
          #include <thread>
          #include <chrono>

          #include "wifi/wfbng_link.h"
          #include "player/udp_player.h"

          static std::atomic<bool> g_stop{false};
          static void handle_sig(int) { g_stop = true; }

          static int  env_int(const char *n, int def)  { auto v=std::getenv(n); return v?std::atoi(v):def; }
          static std::string env_str(const char *n, std::string d) { auto v=std::getenv(n); return v?v:d; }

          int main() {
              std::signal(SIGINT,  handle_sig);
              std::signal(SIGTERM, handle_sig);

              const int       channel   = env_int("SKYDECK_CHANNEL",  161);
              const int       bw        = env_int("SKYDECK_BW",        0);   // 0=20MHz 1=40MHz
              const int       out_port  = env_int("SKYDECK_PORT",    5600);
              const uint32_t  link_id   = (uint32_t)env_int("SKYDECK_LINK_ID", 7669206);
              std::string key = env_str("SKYDECK_KEY",
                  std::string(std::getenv("HOME") ?: "") + "/.aviateur/gs.key");

              fprintf(stderr, "[skydeck_rx] channel=%d bw=%s key=%s port=%d\n",
                      channel, bw ? "40MHz" : "20MHz", key.c_str(), out_port);

              // Enumerate adapters
              auto devices = WfbngLink::get_device_list();
              if (devices.empty()) {
                  fprintf(stderr, "[skydeck_rx] No supported adapters found\n");
                  return 1;
              }
              fprintf(stderr, "[skydeck_rx] Using: %s\n", devices[0].display_name.c_str());

              WfbngLink link;
              if (!link.start(devices[0], (uint8_t)channel, bw, key)) {
                  fprintf(stderr, "[skydeck_rx] Failed to start WfbngLink\n");
                  return 1;
              }

              fprintf(stderr, "[skydeck_rx] Receiving — video → udp://127.0.0.1:%d\n", out_port);
              while (!g_stop) {
                  std::this_thread::sleep_for(std::chrono::milliseconds(500));
              }

              link.stop();
              return 0;
          }
          EOF

      - name: Configure skydeck_rx (headless Aviateur wifi stack)
        run: |
          cmake -S /tmp/aviateur-src -B /tmp/skydeck-rx-build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_STANDARD=20 \
            -DCMAKE_EXE_LINKER_FLAGS="-static-libgcc -static-libstdc++" \
            -DAVIATEUR_HEADLESS=ON \
            -DAVIATEUR_HEADLESS_MAIN=/tmp/aviateur-src/src/headless_main.cpp \
            || cmake -S /tmp/aviateur-src -B /tmp/skydeck-rx-build \
                 -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_STANDARD=20

      - name: Build skydeck_rx
        run: |
          # Try to build — if Aviateur's CMake doesn't support headless mode,
          # fall back to building the full aviateur binary as skydeck_rx
          cmake --build /tmp/skydeck-rx-build --parallel 2>&1 | tail -20
          BINARY=$(find /tmp/skydeck-rx-build -name "aviateur" -o -name "skydeck_rx" | head -1)
          echo "SKYDECK_RX=$BINARY" >> "$GITHUB_ENV"
          echo "Binary: $BINARY"
          file "$BINARY"
          ldd  "$BINARY" || true

      - name: Package
        run: |
          mkdir -p /tmp/dist-skydeck-rx
          cp "$SKYDECK_RX" /tmp/dist-skydeck-rx/skydeck_rx
          printf 'aviateur_sha=%s\nbuilt=%s\nskydeck_tag=%s\n' \
            "$AVIATEUR_SHA" \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            "$GITHUB_REF_NAME" \
            > /tmp/dist-skydeck-rx/skydeck_rx.version
          chmod +x /tmp/dist-skydeck-rx/skydeck_rx

          tar -czf /tmp/skydeck-rx-x86_64-linux.tar.gz -C /tmp/dist-skydeck-rx .
          sha256sum /tmp/skydeck-rx-x86_64-linux.tar.gz \
            > /tmp/skydeck-rx-x86_64-linux.tar.gz.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: skydeck-rx-x86_64-linux
          path: |
            /tmp/skydeck-rx-x86_64-linux.tar.gz
            /tmp/skydeck-rx-x86_64-linux.tar.gz.sha256
          retention-days: 14

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            /tmp/skydeck-rx-x86_64-linux.tar.gz
            /tmp/skydeck-rx-x86_64-linux.tar.gz.sha256
