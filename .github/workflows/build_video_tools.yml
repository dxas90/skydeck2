name: Build video tools

# Builds two binaries needed for the independent video pipeline (no Aviateur):
#
#   rxdemo   — OpenIPC/devourer  — userspace RTL8812AU driver (RF capture)
#   wfb_rx   — svpcom/wfb-ng    — WFB-NG decryptor (raw frames → RTP UDP)
#
# Both are x86_64 Linux static binaries, shipped as release assets so
# install.sh can download them to the Steam Deck without any build tools.
#
# Runs on every push/PR (artifact only) and on v* tags (release asset).

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]

jobs:
  # ---------------------------------------------------------------------------
  # 1. devourer rxdemo
  # ---------------------------------------------------------------------------
  build-devourer:
    name: Build devourer rxdemo (x86_64 Linux)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ pkg-config libusb-1.0-0-dev git

      - name: Clone devourer
        env:
          DEVOURER_REF: master
        run: |
          git clone --depth 1 --branch "$DEVOURER_REF" \
            https://github.com/OpenIPC/devourer.git /tmp/devourer-src
          echo "DEVOURER_SHA=$(git -C /tmp/devourer-src rev-parse --short HEAD)" \
            >> "$GITHUB_ENV"

      - name: Configure (RTL8812AU only)
        run: |
          cmake -S /tmp/devourer-src -B /tmp/devourer-build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXE_LINKER_FLAGS="-static-libgcc -static-libstdc++" \
            -DDEVOURER_8814=OFF \
            -DDEVOURER_JAGUAR2_8822B=OFF \
            -DDEVOURER_JAGUAR2_8821C=OFF \
            -DDEVOURER_JAGUAR3_8822C=OFF \
            -DDEVOURER_JAGUAR3_8822E=OFF \
            -DDEVOURER_8733B=OFF \
            -DDEVOURER_KESTREL_8852B=OFF \
            -DDEVOURER_KESTREL_8852C=OFF \
            -DDEVOURER_LOG_MAX_LEVEL=WARN

      - name: Build
        run: cmake --build /tmp/devourer-build --parallel

      - name: Self-tests
        run: ctest --test-dir /tmp/devourer-build --output-on-failure

      - name: Package
        run: |
          RXDEMO=$(find /tmp/devourer-build -name "rxdemo" -type f | head -1)
          echo "Binary: $RXDEMO"
          file "$RXDEMO"
          ldd  "$RXDEMO" || true

          mkdir -p /tmp/dist-devourer
          cp "$RXDEMO" /tmp/dist-devourer/rxdemo
          printf 'devourer_sha=%s\nbuilt=%s\nskydeck_tag=%s\n' \
            "$DEVOURER_SHA" \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            "$GITHUB_REF_NAME" \
            > /tmp/dist-devourer/devourer.version
          chmod +x /tmp/dist-devourer/rxdemo

          tar -czf /tmp/rxdemo-x86_64-linux.tar.gz -C /tmp/dist-devourer .
          sha256sum /tmp/rxdemo-x86_64-linux.tar.gz \
            > /tmp/rxdemo-x86_64-linux.tar.gz.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: rxdemo-x86_64-linux
          path: |
            /tmp/rxdemo-x86_64-linux.tar.gz
            /tmp/rxdemo-x86_64-linux.tar.gz.sha256
          retention-days: 14

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            /tmp/rxdemo-x86_64-linux.tar.gz
            /tmp/rxdemo-x86_64-linux.tar.gz.sha256

  # ---------------------------------------------------------------------------
  # 2. skydeck_rx — headless WFB-NG video receiver
  #
  # Aviateur already contains the full pipeline:
  #   devourer (libusb RF capture) + wfb-ng aggregator (decrypt/FEC) + ffmpeg
  # We clone Aviateur, build only its wifi+player stack (no GUI, no SDL),
  # and add a tiny headless main that writes decoded RTP to UDP.
  #
  # This produces one self-contained binary that replaces both rxdemo + wfb_rx:
  #   skydeck_rx → udp://127.0.0.1:5600 → gst-launch / mpv
  # ---------------------------------------------------------------------------
  build-skydeck-rx:
    name: Build skydeck_rx headless (x86_64 Linux)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ pkg-config git \
            libusb-1.0-0-dev libsodium-dev libpcap-dev

      - name: Clone Aviateur (wifi + devourer submodules only — skip GUI)
        env:
          AVIATEUR_REF: main
        run: |
          # Clone without submodules first, then init only what we need.
          # vecgui (3rd/vecgui) and SDL (3rd/SDL) are GUI-only — skip them.
          # The headless build needs: 3rd/devourer, 3rd/json, 3rd/mINI
          git clone --depth 1 --branch "$AVIATEUR_REF" \
            https://github.com/OpenIPC/aviateur.git /tmp/aviateur-src
          cd /tmp/aviateur-src
          git submodule update --init --depth 1 \
            3rd/devourer \
            3rd/json \
            3rd/mINI
          echo "AVIATEUR_SHA=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Write headless main (no GUI, no SDL — just devourer + wfb + UDP out)
        run: |
          python3 - << 'PYEOF'
          import textwrap, pathlib
          src = textwrap.dedent("""
          /*
           * headless_main.cpp — SkyDeck headless WFB-NG receiver
           * devourer (RTL8812AU libusb) + wfb-ng Forwarder (UDP output)
           * Outputs raw WFB-NG RTP to udp://127.0.0.1:SKYDECK_PORT
           *
           * Env vars:
           *   SKYDECK_CHANNEL   WiFi channel (default 161)
           *   SKYDECK_BW        0=20MHz 1=40MHz (default 0)
           *   SKYDECK_PORT      UDP output port (default 5600)
           *   SKYDECK_LINK_ID   WFB-NG link_id (default 7669206)
           *   SKYDECK_KEY       gs.key path (default ~/.aviateur/gs.key)
           */
          #include <csignal>
          #include <cstdio>
          #include <cstdlib>
          #include <cstring>
          #include <memory>
          #include <string>

          #include <libusb-1.0/libusb.h>
          #include "WiFiDriver.h"
          #include "RxPacket.h"
          #include "SelectedChannel.h"
          #include "logger.h"
          #include "wfb-ng/rx.hpp"

          static std::unique_ptr<IRtlDevice> g_device;

          static void on_signal(int) {
              if (g_device) g_device->StopRxLoop();
          }

          static int         ei(const char *n, int d)      { auto v=std::getenv(n); return v?std::atoi(v):d; }
          static std::string es(const char *n, std::string d) { auto v=std::getenv(n); return v?v:d; }
          static uint32_t    eu(const char *n, uint32_t d) { auto v=std::getenv(n); return v?(uint32_t)std::stoul(v):d; }

          int main() {
              std::signal(SIGINT,  on_signal);
              std::signal(SIGTERM, on_signal);

              const int      ch_num  = ei("SKYDECK_CHANNEL", 161);
              const int      bw_idx  = ei("SKYDECK_BW",        0);
              const int      port    = ei("SKYDECK_PORT",    5600);
              const uint32_t link_id = eu("SKYDECK_LINK_ID", 7669206);
              std::string    key     = es("SKYDECK_KEY",
                  std::string(std::getenv("HOME")?std::getenv("HOME"):"") + "/.aviateur/gs.key");

              fprintf(stderr, "[skydeck_rx] ch=%d bw=%s key=%s port=%d link_id=%u\\n",
                      ch_num, bw_idx?"40MHz":"20MHz", key.c_str(), port, link_id);

              // Forwarder: concrete subclass of Aggregator that sends decoded video to UDP.
              // Aggregator(keypair_path, epoch, channel_id)
              // Forwarder(client_addr, client_port, snd_buf_size)
              // We use Forwarder which already implements send_to_socket via UDP.
              auto fwd = std::make_unique<Forwarder>("127.0.0.1", port, 0);

              libusb_context *ctx = nullptr;
              if (libusb_init(&ctx) != 0) {
                  fputs("[skydeck_rx] libusb_init failed\\n", stderr); return 1;
              }

              auto *handle = libusb_open_device_with_vid_pid(ctx, 0x0bda, 0x8812);
              if (!handle) {
                  fputs("[skydeck_rx] RTL8812AU (0bda:8812) not found\\n", stderr);
                  libusb_exit(ctx); return 1;
              }
              libusb_detach_kernel_driver(handle, 0);
              libusb_claim_interface(handle, 0);

              // WiFiDriver takes an optional Logger_t; default-construct for silent logging
              WiFiDriver drv{Logger_t{}};
              g_device = drv.CreateRtlDevice(handle, ctx);
              if (!g_device) {
                  fputs("[skydeck_rx] CreateRtlDevice failed\\n", stderr); return 1;
              }

              // SelectedChannel: {Channel, ChannelOffset, ChannelWidth}
              SelectedChannel selected_ch{
                  (uint8_t)ch_num,
                  (uint8_t)0,
                  bw_idx ? CHANNEL_WIDTH_40 : CHANNEL_WIDTH_20
              };

              fprintf(stderr, "[skydeck_rx] Listening → udp://127.0.0.1:%d\\n", port);

              // Init = bring-up + blocking RX loop.
              // Forwarder::process_packet receives raw 802.11 frames and forwards
              // decoded video to the UDP socket.
              g_device->Init(
                  [&fwd](const Packet &pkt) {
                      // pkt.Data is std::span<uint8_t> — the raw 802.11 frame
                      // pkt.RxAtrib.rssi[0..3] — per-path RSSI
                      int8_t rssi[2]  = {
                          (int8_t)pkt.RxAtrib.rssi[0],
                          (int8_t)pkt.RxAtrib.rssi[1]
                      };
                      int8_t noise[2] = { 127, 127 };
                      fwd->process_packet(
                          pkt.Data.data(), pkt.Data.size(),
                          0, nullptr,
                          rssi, noise,
                          0, 0, 0, nullptr);
                  },
                  selected_ch);

              libusb_close(handle);
              libusb_exit(ctx);
              return 0;
          }
          """).lstrip()
          pathlib.Path("/tmp/aviateur-src/src/headless_main.cpp").write_text(src)
          print("headless_main.cpp written", len(src), "bytes")
          PYEOF

      - name: Write standalone CMakeLists.txt (bypass Aviateur GUI build system)
        run: |
          mkdir -p /tmp/skydeck_rx_build
          python3 - << 'PYEOF'
          import textwrap, pathlib
          cmake = textwrap.dedent("""
          cmake_minimum_required(VERSION 3.18)
          project(skydeck_rx LANGUAGES C CXX)
          set(CMAKE_CXX_STANDARD 20)

          find_package(PkgConfig REQUIRED)
          pkg_check_modules(LIBUSB    REQUIRED IMPORTED_TARGET libusb-1.0)
          pkg_check_modules(LIBSODIUM REQUIRED IMPORTED_TARGET libsodium)
          pkg_check_modules(LIBPCAP   REQUIRED IMPORTED_TARGET libpcap)

          set(DEVOURER_8814          OFF CACHE BOOL "" FORCE)
          set(DEVOURER_JAGUAR2_8822B OFF CACHE BOOL "" FORCE)
          set(DEVOURER_JAGUAR2_8821C OFF CACHE BOOL "" FORCE)
          set(DEVOURER_JAGUAR3_8822C OFF CACHE BOOL "" FORCE)
          set(DEVOURER_JAGUAR3_8822E OFF CACHE BOOL "" FORCE)
          set(DEVOURER_8733B         OFF CACHE BOOL "" FORCE)
          set(DEVOURER_KESTREL_8852B OFF CACHE BOOL "" FORCE)
          set(DEVOURER_KESTREL_8852C OFF CACHE BOOL "" FORCE)
          set(DEVOURER_LOG_MAX_LEVEL WARN CACHE STRING "" FORCE)
          add_subdirectory(${AVIATEUR_SRC}/3rd/devourer devourer_build EXCLUDE_FROM_ALL)

          # WFB-NG sources only (no wfbng_link.cpp — it depends on vecgui/GUI)
          # zfex.c provides fec_t used by rx.cpp/rx.hpp
          set(WFB_SRCS
              ${AVIATEUR_SRC}/src/wifi/wfb-ng/rx.cpp
              ${AVIATEUR_SRC}/src/wifi/wfb-ng/wifibroadcast.cpp
              ${AVIATEUR_SRC}/src/wifi/wfb-ng/zfex.c
          )

          add_executable(skydeck_rx ${HEADLESS_MAIN} ${WFB_SRCS})

          # PREINCLUDE_FILE points to zfex.h — wifibroadcast.hpp uses #include PREINCLUDE_FILE
          # zfex.h defines fec_t used by rx.hpp
          target_compile_definitions(skydeck_rx PRIVATE
              PREINCLUDE_FILE="${AVIATEUR_SRC}/src/wifi/wfb-ng/zfex.h"
              ZFEX_UNROLL_ADDMUL_SIMD=8 ZFEX_USE_INTEL_SSSE3
              ZFEX_INLINE_ADDMUL ZFEX_INLINE_ADDMUL_SIMD)

          target_include_directories(skydeck_rx PRIVATE
              ${AVIATEUR_SRC}/src/wifi
              ${AVIATEUR_SRC}/src/wifi/compat
              ${AVIATEUR_SRC}/src/wifi/wfb-ng
              ${AVIATEUR_SRC}/src/wifi/wfb-ng/include
              ${AVIATEUR_SRC}/3rd/devourer/src
              ${AVIATEUR_SRC}/3rd/devourer/hal)
          target_link_libraries(skydeck_rx PRIVATE
              devourer PkgConfig::LIBUSB PkgConfig::LIBSODIUM PkgConfig::LIBPCAP)
          """).lstrip()
          pathlib.Path("/tmp/skydeck_rx_build/CMakeLists.txt").write_text(cmake)
          print("CMakeLists.txt written", len(cmake), "bytes")
          PYEOF

      - name: Configure skydeck_rx
        run: |
          cmake -S /tmp/skydeck_rx_build -B /tmp/skydeck_rx_cmake \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXE_LINKER_FLAGS="-static-libgcc -static-libstdc++" \
            -DAVIATEUR_SRC=/tmp/aviateur-src \
            -DHEADLESS_MAIN=/tmp/aviateur-src/src/headless_main.cpp

      - name: Build skydeck_rx
        run: |
          cmake --build /tmp/skydeck_rx_cmake --parallel 2>&1 | tail -30
          BINARY=$(find /tmp/skydeck_rx_cmake -name "skydeck_rx" -type f | head -1)
          echo "SKYDECK_RX=$BINARY" >> "$GITHUB_ENV"
          echo "Binary: $BINARY"
          file "$BINARY"
          ldd  "$BINARY" || true

      - name: Package
        run: |
          mkdir -p /tmp/dist-skydeck-rx
          cp "$SKYDECK_RX" /tmp/dist-skydeck-rx/skydeck_rx
          printf 'aviateur_sha=%s\nbuilt=%s\nskydeck_tag=%s\n' \
            "$AVIATEUR_SHA" \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            "$GITHUB_REF_NAME" \
            > /tmp/dist-skydeck-rx/skydeck_rx.version
          chmod +x /tmp/dist-skydeck-rx/skydeck_rx

          tar -czf /tmp/skydeck-rx-x86_64-linux.tar.gz -C /tmp/dist-skydeck-rx .
          sha256sum /tmp/skydeck-rx-x86_64-linux.tar.gz \
            > /tmp/skydeck-rx-x86_64-linux.tar.gz.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: skydeck-rx-x86_64-linux
          path: |
            /tmp/skydeck-rx-x86_64-linux.tar.gz
            /tmp/skydeck-rx-x86_64-linux.tar.gz.sha256
          retention-days: 14

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            /tmp/skydeck-rx-x86_64-linux.tar.gz
            /tmp/skydeck-rx-x86_64-linux.tar.gz.sha256
