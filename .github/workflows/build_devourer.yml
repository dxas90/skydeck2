name: Build devourer

# Builds devourer rxdemo as a static x86_64 Linux binary and attaches it
# to every SkyDeck release (v* tag).
#
# Also runs on every push/PR to main so we catch build breaks early —
# the artifact is uploaded but not published as a release asset on those runs.

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]

jobs:
  build-devourer:
    name: Build devourer rxdemo (x86_64 Linux static)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # System dependencies
      # -----------------------------------------------------------------------
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake \
            ninja-build \
            g++ \
            pkg-config \
            libusb-1.0-0-dev \
            git

      # -----------------------------------------------------------------------
      # Clone devourer at a pinned commit for reproducible builds.
      # Update DEVOURER_REF to bump the version.
      # -----------------------------------------------------------------------
      - name: Clone devourer
        env:
          DEVOURER_REF: master   # pin to a tag/commit for reproducibility
        run: |
          git clone --depth 1 --branch "$DEVOURER_REF" \
            https://github.com/OpenIPC/devourer.git \
            /tmp/devourer-src
          echo "DEVOURER_SHA=$(git -C /tmp/devourer-src rev-parse --short HEAD)" \
            >> "$GITHUB_ENV"

      # -----------------------------------------------------------------------
      # Build — RTL8812AU only (smallest binary, all we need).
      # Static-link libusb so the binary runs on SteamOS without extra packages.
      # -----------------------------------------------------------------------
      - name: Configure devourer (8812AU only)
        run: |
          cmake -S /tmp/devourer-src -B /tmp/devourer-build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXE_LINKER_FLAGS="-static-libgcc -static-libstdc++" \
            -DDEVOURER_8814=OFF \
            -DDEVOURER_JAGUAR2_8822B=OFF \
            -DDEVOURER_JAGUAR2_8821C=OFF \
            -DDEVOURER_JAGUAR3_8822C=OFF \
            -DDEVOURER_JAGUAR3_8822E=OFF \
            -DDEVOURER_8733B=OFF \
            -DDEVOURER_KESTREL_8852B=OFF \
            -DDEVOURER_KESTREL_8852C=OFF \
            -DDEVOURER_LOG_MAX_LEVEL=WARN

      - name: Build devourer
        run: cmake --build /tmp/devourer-build --parallel

      - name: Run headless self-tests
        run: ctest --test-dir /tmp/devourer-build --output-on-failure

      # -----------------------------------------------------------------------
      # Package the binary
      # -----------------------------------------------------------------------
      - name: Find and verify rxdemo binary
        run: |
          RXDEMO=$(find /tmp/devourer-build -name "rxdemo" -type f | head -1)
          echo "RXDEMO=$RXDEMO" >> "$GITHUB_ENV"
          echo "Binary: $RXDEMO"
          file "$RXDEMO"
          ldd  "$RXDEMO" || true   # show remaining dynamic deps (libusb ideally static)

      - name: Package binary
        run: |
          mkdir -p /tmp/dist
          cp "$RXDEMO" /tmp/dist/rxdemo
          # Include a version stamp
          echo "devourer_sha=$DEVOURER_SHA" > /tmp/dist/devourer.version
          echo "built=$(date -u +%Y-%m-%dT%H:%M:%SZ)"  >> /tmp/dist/devourer.version
          echo "skydeck_tag=${GITHUB_REF_NAME}"          >> /tmp/dist/devourer.version
          chmod +x /tmp/dist/rxdemo
          tar -czf /tmp/rxdemo-x86_64-linux.tar.gz -C /tmp/dist .
          sha256sum /tmp/rxdemo-x86_64-linux.tar.gz > /tmp/rxdemo-x86_64-linux.tar.gz.sha256
          cat /tmp/dist/devourer.version

      # -----------------------------------------------------------------------
      # Upload artifact on every run (useful for PR/push builds)
      # -----------------------------------------------------------------------
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rxdemo-x86_64-linux
          path: |
            /tmp/rxdemo-x86_64-linux.tar.gz
            /tmp/rxdemo-x86_64-linux.tar.gz.sha256
          retention-days: 14

      # -----------------------------------------------------------------------
      # Attach to GitHub Release on v* tags
      # -----------------------------------------------------------------------
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            /tmp/rxdemo-x86_64-linux.tar.gz
            /tmp/rxdemo-x86_64-linux.tar.gz.sha256
